<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Customer Details</title>
</head>
<body>
    {% for invoice in all_invoices %}
    <p>Invoice {{invoice.number}} - Customer: {{invoice.customer}}, Amount: {{invoice.amount}}</p>
    {% endfor %}

    {% if invoice.amount > 700000 %}
    <p>High Value Customer</p>
    {% else %}
    <p>Regular Customer</p>
    {% endif %}
</body>
</html>
