
{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Billing System{% endblock %}</title>
    <link rel="stylesheet" href="{% static 'style.css' %}">
</head>
<body>

    <header class="navbar">
        <h2>BillEase</h2>
        <nav>
            <a href="{% url 'home' %}">Home</a>
            <a href="{% url 'invoice_list' %}">Invoices</a>
        </nav>
    </header>

    <main class="container">
        {% block content %}
        {% endblock %}
    </main>

    <footer>
        <p>BillEase · Simple billing, made easier.</p>
    </footer>

</body>
</html>
